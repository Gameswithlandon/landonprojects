<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>uptime — Landon Projects</title>
<meta name="description" content="Live status and 30-day uptime for Landon's homelab.">
<meta name="theme-color" content="#0a0a0c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0c'/%3E%3Ctext x='7' y='23' font-family='monospace' font-size='20' fill='%23ffb300'%3E%3E%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Cloudflare Web Analytics: paste the <script defer src="https://static.cloudflareinsights.com/..."> snippet here -->
<style>
  :root {
    --bg-raised: #111114;
    --border: #232326;
    --amber: #ffb300;
    --amber-dim: #b8830a;
    --cyan: #5fc9d9;
    --text: #e8e6e1;
    --muted: #85858c;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html { color-scheme: dark; }

  body {
    margin: 0;
    position: relative;
    background: radial-gradient(ellipse 120% 55% at 50% -10%, #141416 0%, #0a0a0c 45%, #060608 100%);
    color: var(--text);
    font-family: var(--mono);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  body::before, body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  body::before {
    background-image:
      radial-gradient(1px 1px at 8% 18%, rgba(255,255,255,0.55), transparent 100%),
      radial-gradient(1px 1px at 22% 62%, rgba(255,255,255,0.4), transparent 100%),
      radial-gradient(1px 1px at 38% 12%, rgba(255,255,255,0.5), transparent 100%),
      radial-gradient(1px 1px at 52% 78%, rgba(255,255,255,0.3), transparent 100%),
      radial-gradient(1px 1px at 68% 32%, rgba(255,255,255,0.45), transparent 100%),
      radial-gradient(1px 1px at 82% 58%, rgba(255,255,255,0.35), transparent 100%),
      radial-gradient(1px 1px at 14% 84%, rgba(255,255,255,0.4), transparent 100%),
      radial-gradient(1px 1px at 92% 14%, rgba(255,255,255,0.45), transparent 100%),
      radial-gradient(1px 1px at 3% 48%, rgba(255,255,255,0.3), transparent 100%),
      radial-gradient(1px 1px at 60% 4%, rgba(255,255,255,0.45), transparent 100%);
    background-repeat: repeat;
    background-size: 380px 380px;
    opacity: 0.55;
  }

  body::after {
    background-image:
      radial-gradient(1.5px 1.5px at 28% 38%, rgba(210,225,255,0.5), transparent 100%),
      radial-gradient(1.5px 1.5px at 74% 64%, rgba(210,225,255,0.4), transparent 100%),
      radial-gradient(1.5px 1.5px at 48% 88%, rgba(210,225,255,0.35), transparent 100%),
      radial-gradient(1.5px 1.5px at 12% 8%, rgba(210,225,255,0.4), transparent 100%),
      radial-gradient(1.5px 1.5px at 88% 28%, rgba(210,225,255,0.4), transparent 100%);
    background-repeat: repeat;
    background-size: 600px 600px;
    opacity: 0.4;
  }

  a { color: var(--cyan); text-decoration: none; border-bottom: 1px solid transparent; }
  a:hover, a:focus-visible { border-bottom-color: var(--cyan); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
    padding: 3rem 1.5rem 4rem;
  }

  .topbar {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--amber);
    border-bottom: none;
  }

  .brand:hover, .brand:focus-visible { border-bottom: none; opacity: 0.8; }

  .topnav { display: flex; gap: 1.25rem; font-size: 0.85rem; }

  .page-title {
    font-size: 1.1rem;
    color: var(--text);
    margin: 0 0 0.4rem;
  }

  .page-sub {
    color: var(--muted);
    font-size: 0.88rem;
    margin: 0 0 2.5rem;
  }

  .section-heading {
    font-size: 0.9rem;
    color: var(--muted);
    margin: 0 0 0.9rem;
  }

  .project-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1rem 0;
    border-top: 1px solid var(--border);
  }

  .project-row:last-child { border-bottom: 1px solid var(--border); }

  .project-name { font-weight: 500; color: var(--text); }
  .project-desc { color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; }

  .row-right { display: flex; align-items: center; gap: 0.9rem; flex-shrink: 0; }

  .uptime-pct {
    font-size: 0.85rem;
    color: var(--muted);
    white-space: nowrap;
    transition: color 0.2s ease;
  }

  .uptime-pct[data-level="good"] { color: #3fb660; }
  .uptime-pct[data-level="warn"] { color: var(--muted); }
  .uptime-pct[data-level="bad"] { color: var(--muted); }

  .uptime-graph {
    position: relative;
    margin: 0.75rem 0 0;
    padding: 0.85rem 0 0.15rem;
    border-top: 1px dashed var(--border);
  }

  .uptime-graph-meta {
    display: flex;
    justify-content: space-between;
    gap: 0.75rem;
    margin: 0 0 0.55rem;
    color: var(--muted);
    font-size: 0.72rem;
  }

  .uptime-graph-meta.is-active .uptime-hover {
    color: var(--text);
  }

  .uptime-plot {
    position: relative;
  }

  .uptime-bars {
    display: grid;
    grid-template-columns: repeat(30, minmax(0, 1fr));
    align-items: end;
    gap: 3px;
    height: 52px;
  }

  .uptime-bar {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .uptime-bar::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--bar-h, 3px);
    border-radius: 2px 2px 1px 1px;
    background: rgba(133, 133, 140, 0.35);
    transform: scaleY(0.08);
    transform-origin: bottom center;
    transition:
      transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
      background 0.2s ease,
      opacity 0.2s ease,
      filter 0.2s ease;
    transition-delay: var(--bar-delay, 0ms);
  }

  .uptime-bars.is-ready .uptime-bar::before {
    transform: scaleY(1);
  }

  .uptime-bar[data-level="good"]::before { background: #3fb660; }
  .uptime-bar[data-level="warn"]::before { background: #d9a441; }
  .uptime-bar[data-level="bad"]::before { background: #e5534b; }
  .uptime-bar[data-level="empty"]::before {
    background: rgba(133, 133, 140, 0.18);
    --bar-h: 3px;
  }

  .uptime-bars.is-dimming .uptime-bar:not(.is-active)::before {
    opacity: 0.28;
    filter: saturate(0.65);
  }

  .uptime-bar:hover::before,
  .uptime-bar:focus-visible::before,
  .uptime-bar.is-active::before {
    opacity: 1;
    filter: brightness(1.15);
  }

  .uptime-bar:focus-visible {
    outline: 1px solid var(--amber);
    outline-offset: 2px;
  }

  .uptime-tip {
    position: absolute;
    z-index: 3;
    top: 0;
    left: 0;
    min-width: 7rem;
    padding: 0.35rem 0.55rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg-raised);
    color: var(--text);
    font-size: 0.72rem;
    line-height: 1.35;
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translate(-50%, -6px);
    transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
  }

  .uptime-tip.is-visible {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, -12px);
  }

  .uptime-tip strong {
    display: block;
    color: var(--amber);
    font-weight: 500;
  }

  .project-block { border-top: 1px solid var(--border); }
  .project-block:last-child { border-bottom: 1px solid var(--border); }

  .project-row {
    border-top: none;
  }

  .project-row:last-child { border-bottom: none; }

  @media (prefers-reduced-motion: reduce) {
    .uptime-bar::before,
    .uptime-tip { transition: none; }
    .uptime-bars.is-ready .uptime-bar::before { transform: none; }
  }

  .status-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    padding: 0;
    border: none;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .status-icon { width: 18px; height: 18px; }

  .status-icon circle, .status-icon path {
    fill: none;
    stroke: var(--border);
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 0.2s ease;
  }

  .status-btn[data-status="up"] .status-icon circle,
  .status-btn[data-status="up"] .status-icon path { stroke: #3fb660; }

  .status-btn[data-status="down"] .status-icon circle,
  .status-btn[data-status="down"] .status-icon path { stroke: #e5534b; }

  .status-btn[data-status="grace"] .status-icon circle,
  .status-btn[data-status="grace"] .status-icon path { stroke: #d9a441; }

  .status-tip {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 0;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 0.75rem;
    white-space: nowrap;
    padding: 0.35rem 0.6rem;
    border-radius: 4px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(4px);
    transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
    pointer-events: none;
    z-index: 2;
  }

  .status-btn:hover .status-tip,
  .status-btn:focus-visible .status-tip,
  .status-btn.show-tip .status-tip {
    opacity: 1; visibility: visible; transform: translateY(0);
  }

  footer {
    margin-top: 3.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 1.25rem;
    font-size: 0.9rem;
  }

  .footer-item { color: var(--muted); }

  @media (max-width: 480px) {
    .wrap { padding: 3rem 1.25rem 3rem; }
    .topbar { padding: 1.25rem 1.25rem 1rem; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="/">landon@projects</a>
  <nav class="topnav" aria-label="Primary">
    <a href="/">home</a>
  </nav>
</header>

<div class="wrap">

  <p class="page-title">uptime/</p>
  <p class="page-sub">Live status, last 30 days, pulled from Healthchecks.io.</p>

  <div>
    <p class="section-heading">homelabs/</p>

    <div class="project-block">
      <div class="project-row">
        <div>
          <div class="project-name">tv-home-server</div>
          <div class="project-desc" id="tv-detail">Checking…</div>
        </div>
        <div class="row-right">
          <span class="uptime-pct" id="tv-pct">—</span>
          <button class="status-btn" type="button" data-status="unknown" data-key="tv" aria-label="Status: checking">
            <svg class="status-icon" viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="9"></circle>
              <path d="M6 10.5l2.5 2.5L14 7.5"></path>
            </svg>
            <span class="status-tip" role="tooltip">Checking…</span>
          </button>
        </div>
      </div>
      <div class="uptime-graph" aria-label="tv-home-server 30-day uptime">
        <div class="uptime-graph-meta" id="tv-meta">
          <span>last 30 days</span>
          <span class="uptime-hover" id="tv-hover">hover a day</span>
        </div>
        <div class="uptime-plot">
          <div class="uptime-bars" id="tv-bars"></div>
          <div class="uptime-tip" id="tv-tip" hidden></div>
        </div>
      </div>
    </div>

    <div class="project-block">
      <div class="project-row">
        <div>
          <div class="project-name">gaming-home-server</div>
          <div class="project-desc" id="gaming-detail">Checking…</div>
        </div>
        <div class="row-right">
          <span class="uptime-pct" id="gaming-pct">—</span>
          <button class="status-btn" type="button" data-status="unknown" data-key="gaming" aria-label="Status: checking">
            <svg class="status-icon" viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="9"></circle>
              <path d="M6 10.5l2.5 2.5L14 7.5"></path>
            </svg>
            <span class="status-tip" role="tooltip">Checking…</span>
          </button>
        </div>
      </div>
      <div class="uptime-graph" aria-label="gaming-home-server 30-day uptime">
        <div class="uptime-graph-meta" id="gaming-meta">
          <span>last 30 days</span>
          <span class="uptime-hover" id="gaming-hover">hover a day</span>
        </div>
        <div class="uptime-plot">
          <div class="uptime-bars" id="gaming-bars"></div>
          <div class="uptime-tip" id="gaming-tip" hidden></div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <a href="https://github.com/Gameswithlandon" target="_blank" rel="noopener">github</a>
    <span class="footer-item">discord: zerge5757</span>
  </footer>

</div>

<script>
  function timeAgo(iso) {
    if (!iso) return 'no pings yet';
    const then = new Date(iso).getTime();
    const diff = Math.max(0, Date.now() - then) / 1000;
    if (diff < 90) return 'last ping just now';
    if (diff < 3600) return 'last ping ' + Math.round(diff / 60) + 'm ago';
    if (diff < 86400) return 'last ping ' + Math.round(diff / 3600) + 'h ago';
    return 'last ping ' + Math.round(diff / 86400) + 'd ago';
  }

  function barLevel(value) {
    if (typeof value !== 'number' || Number.isNaN(value)) return 'empty';
    if (value >= 99.5) return 'good';
    if (value >= 80) return 'warn';
    return 'bad';
  }

  function pctLevel(value) {
    if (typeof value !== 'number' || Number.isNaN(value)) return '';
    return value >= 99.5 ? 'good' : 'warn';
  }

  function dayLabel(dateValue) {
    if (!dateValue) return 'unknown day';
    const date = new Date(dateValue + 'T12:00:00Z');
    if (Number.isNaN(date.getTime())) return dateValue;
    return date.toLocaleDateString('en-US', {
      month: 'short',
      day: 'numeric',
      timeZone: 'UTC',
    });
  }

  function hideTip(key) {
    const root = document.getElementById(key + '-bars');
    const tip = document.getElementById(key + '-tip');
    const hover = document.getElementById(key + '-hover');
    const meta = document.getElementById(key + '-meta');
    if (!root || !tip) return;
    tip.hidden = true;
    tip.classList.remove('is-visible');
    root.classList.remove('is-dimming');
    root.querySelectorAll('.uptime-bar.is-active').forEach(function (bar) {
      bar.classList.remove('is-active');
    });
    if (hover) hover.textContent = 'hover a day';
    if (meta) meta.classList.remove('is-active');
  }

  function showTip(key, bar, day) {
    const root = document.getElementById(key + '-bars');
    const tip = document.getElementById(key + '-tip');
    const hover = document.getElementById(key + '-hover');
    const meta = document.getElementById(key + '-meta');
    const plot = tip.parentElement;
    const value = day && typeof day.uptime === 'number' ? day.uptime : null;
    const label = dayLabel(day && day.date);
    const detail = value == null ? 'no data' : value.toFixed(2) + '%';

    tip.innerHTML = '<strong>' + label + '</strong>' + detail;
    if (hover) hover.textContent = label + ' · ' + detail;
    if (meta) meta.classList.add('is-active');
    root.classList.add('is-dimming');
    root.querySelectorAll('.uptime-bar.is-active').forEach(function (el) {
      el.classList.remove('is-active');
    });
    bar.classList.add('is-active');

    const barRect = bar.getBoundingClientRect();
    const plotRect = plot.getBoundingClientRect();
    tip.hidden = false;
    const tipWidth = tip.offsetWidth || 110;
    var left = barRect.left - plotRect.left + barRect.width / 2;
    left = Math.max(tipWidth / 2 + 4, Math.min(plotRect.width - tipWidth / 2 - 4, left));
    tip.style.left = left + 'px';
    tip.style.top = '0px';
    requestAnimationFrame(function () { tip.classList.add('is-visible'); });
  }

  function renderBars(key, days) {
    const root = document.getElementById(key + '-bars');
    if (!root) return;
    hideTip(key);
    root.classList.remove('is-ready');
    root.replaceChildren();
    const list = Array.isArray(days) && days.length
      ? days
      : Array.from({ length: 30 }, function () { return { date: null, uptime: null }; });

    list.forEach(function (day, index) {
      const bar = document.createElement('button');
      bar.type = 'button';
      bar.className = 'uptime-bar';
      const value = day && typeof day.uptime === 'number' ? day.uptime : null;
      bar.dataset.level = barLevel(value);
      if (value == null) {
        bar.style.setProperty('--bar-h', '3px');
        bar.setAttribute('aria-label', dayLabel(day && day.date) + ', no data');
      } else {
        bar.style.setProperty('--bar-h', Math.max(6, Math.round((value / 100) * 52)) + 'px');
        bar.style.setProperty('--bar-delay', Math.min(index * 12, 280) + 'ms');
        bar.setAttribute('aria-label', dayLabel(day.date) + ', ' + value.toFixed(2) + '% uptime');
      }
      const activate = function () { showTip(key, bar, day || {}); };
      bar.addEventListener('mouseenter', activate);
      bar.addEventListener('focus', activate);
      bar.addEventListener('mousemove', activate);
      bar.addEventListener('click', activate);
      root.appendChild(bar);
    });

    root.onmouseleave = function () { hideTip(key); };
    root.onfocusout = function (event) {
      if (!root.contains(event.relatedTarget)) hideTip(key);
    };

    requestAnimationFrame(function () {
      requestAnimationFrame(function () { root.classList.add('is-ready'); });
    });
  }

  function applyRow(key, data) {
    const btn = document.querySelector('.status-btn[data-key="' + key + '"]');
    const tip = btn.querySelector('.status-tip');
    const pct = document.getElementById(key + '-pct');
    const detail = document.getElementById(key + '-detail');

    const status = data.status === 'down' ? 'down' : data.status === 'up' ? 'up' : 'grace';
    btn.dataset.status = data.status === 'unknown' ? 'unknown' : status;

    const label = data.status === 'up' ? 'Up' : data.status === 'down' ? 'Down' : data.status === 'unknown' ? 'Unavailable' : 'Late';

    if (data.uptime_30d == null) {
      pct.textContent = '—';
      pct.dataset.level = '';
      tip.textContent = label;
    } else {
      const rounded = data.uptime_30d.toFixed(2);
      pct.textContent = rounded + '% / 30d';
      pct.dataset.level = pctLevel(data.uptime_30d);
      tip.textContent = label + ' — ' + rounded + '% over 30 days';
    }

    btn.setAttribute('aria-label', tip.textContent);
    detail.textContent = timeAgo(data.last_ping);
    renderBars(key, data.days);
  }

  fetch('/api/uptime', { cache: 'no-store' })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      ['tv', 'gaming'].forEach(function (key) {
        if (data[key]) applyRow(key, data[key]);
      });
    })
    .catch(function () {
      ['tv', 'gaming'].forEach(function (key) {
        applyRow(key, { status: 'unknown', uptime_30d: null, last_ping: null, days: [] });
      });
    });

  document.querySelectorAll('.status-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const isOpen = btn.classList.contains('show-tip');
      document.querySelectorAll('.status-btn.show-tip').forEach(function (b) { b.classList.remove('show-tip'); });
      if (!isOpen) btn.classList.add('show-tip');
    });
  });

  document.addEventListener('click', function (e) {
    if (!e.target.closest('.status-btn')) {
      document.querySelectorAll('.status-btn.show-tip').forEach(function (b) { b.classList.remove('show-tip'); });
    }
  });
</script>

</body>
</html>
